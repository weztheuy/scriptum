<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Регистрация — w\Scriptum</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/pages/auth.css">
</head>
<body>
  <div class="page">
    <header class="site-header" role="banner">
      <div class="container header-inner">
        <nav class="nav-left" aria-label="Основная навигация">
          <a class="nav-link" href="/">Главное</a>
          <a class="nav-link" href="/works">Библиотека</a>
          <a class="nav-link" href="/authors">Авторы</a>
        </nav>

        <div id="header-user" class="header-user" aria-live="polite"></div>
      </div>
    </header>

    <main class="container auth-page" role="main">
      <div class="auth-card" role="region" aria-labelledby="reg-title">
        <h2 id="reg-title" class="auth-title">Регистрация</h2>
        <p class="auth-desc">После регистрации вам придёт код подтверждения на почту.</p>

        <form id="register-form" novalidate>
          <div class="form-row">
            <label for="username">Логин</label>
            <input id="username" name="username" type="text" placeholder="например, ivan_dev" required minlength="3" />
          </div>

          <div class="form-row">
            <label for="email">Почта</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="form-row">
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" placeholder="минимум 8 символов" required minlength="8" />
          </div>

          <div class="form-row">
            <label for="password2">Подтверждение пароля</label>
            <input id="password2" name="password2" type="password" placeholder="повторите пароль" required />
          </div>

          <div class="form-error" id="register-error" role="alert" aria-live="assertive"></div>

          <div class="form-actions">
            <button type="submit" class="btn primary">Зарегистрироваться</button>
            <a class="btn minimal" href="../index.html">Отмена</a>
          </div>
        </form>

        <div id="verify-box" class="verify-box" aria-hidden="true">
          <div class="tiny">На указанный адрес отправлен код подтверждения. Введите код для завершения регистрации.</div>

          <!-- Больше пространства между текстом и кнопками -->
          <div style="height:12px;"></div>

          <div class="verify-row">
            <input id="verify-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="Код из письма" />
            <button id="verify-submit" class="btn primary">Отправить</button>
            <button id="resend-code" class="btn outline">Отправить письмо ещё раз</button>
          </div>

          <div id="verify-status" class="tiny" aria-live="polite" style="margin-top:12px;color:var(--muted);"></div>
        </div>
      </div>
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="container footer-inner">
        <div class="copyright">© 2025 w\Scriptum</div>
      </div>
    </footer>
  </div>

  <script src="/js/core.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/pages/register.js"></script>
</body>
</html>

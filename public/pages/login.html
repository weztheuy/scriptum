<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Вход — w\Scriptum</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/pages/auth.css">
</head>
<body>
  <div class="page">
    <header class="site-header" role="banner">
      <div class="container header-inner">
        <nav class="nav-left" aria-label="Основная навигация">
          <a class="nav-link" href="/">Главное</a>
          <a class="nav-link" href="/works">Библиотека</a>
          <a class="nav-link" href="/authors">Авторы</a>
        </nav>

        <div id="header-user" class="header-user" aria-live="polite"></div>
      </div>
    </header>

    <main class="container auth-page" role="main">
      <div class="auth-card" role="region" aria-labelledby="login-title">
        <h2 id="login-title" class="auth-title">Вход</h2>
        <p class="auth-desc">Введите e-mail и пароль для входа в аккаунт.</p>

        <form id="login-form" novalidate>
          <div class="form-row">
            <label for="email">Почта</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="form-row">
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" placeholder="ваш пароль" required />
          </div>

          <div class="form-error" id="login-error" role="alert" aria-live="assertive"></div>

          <div class="form-actions">
            <button type="submit" class="btn primary">Войти</button>
            <a class="btn minimal" href="../index.html">Отмена</a>
          </div>

          <div style="margin-top:12px; font-size:13px; color:var(--muted);">
            Еще нет аккаунта? <a href="register.html">Зарегистрироваться</a>
          </div>
        </form>
      </div>
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="container footer-inner">
        <div class="copyright">© 2025 w\Scriptum</div>
      </div>
    </footer>
  </div>

  <script src="/js/core.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/pages/login.js"></script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>w\Scriptum — Главная</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/pages/index.css">
</head>
<body>
  <div class="page">
    <!-- Header -->
    <header class="site-header" role="banner">
      <div class="container header-inner">
        <nav class="nav-left" aria-label="Основная навигация">
          <a class="nav-link" href="/">Главное</a>
          <a class="nav-link" href="/works">Библиотека</a>
          <a class="nav-link" href="/authors">Авторы</a>
        </nav>

        <!-- Рендерится динамически через public/js/header.js -->
        <div id="header-user" class="header-user placeholder" aria-live="polite"></div>
      </div>
    </header>

    <!-- Main content -->
    <main class="container main-content" role="main">
      <section class="hero">
        <h1 class="title">w\Scriptum — платформа для публикации и чтения</h1>
        <p class="subtitle">Открывайте новые истории, поддерживайте авторов, сохраняйте любимые произведения.</p>
      </section>

      <section class="section">
        <div class="section-header">
          <h2 class="section-title">Новые произведения</h2>
          <a class="btn outline" href="/works">Смотреть все</a>
        </div>

        <!-- Рабочая сетка: ровно 3 карточки в разметке.
             Если API /api/works?sort=new&limit=3 возвращает данные, public/js/pages/index.js заменит содержимое -->
        <div class="works-grid" id="works-grid" aria-busy="false">
          <!-- 3 заглушки/карточки -->
          <article class="card placeholder work-card">
            <div class="cover" aria-hidden="true"></div>
            <div class="card-body">
              <div class="line title"></div>
              <div class="line author"></div>
              <div class="line desc"></div>
              <div class="line desc"></div>
            </div>
          </article>

          <article class="card placeholder work-card">
            <div class="cover" aria-hidden="true"></div>
            <div class="card-body">
              <div class="line title"></div>
              <div class="line author"></div>
              <div class="line desc"></div>
              <div class="line desc"></div>
            </div>
          </article>

          <article class="card placeholder work-card">
            <div class="cover" aria-hidden="true"></div>
            <div class="card-body">
              <div class="line title"></div>
              <div class="line author"></div>
              <div class="line desc"></div>
              <div class="line desc"></div>
            </div>
          </article>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer" role="contentinfo">
      <div class="container footer-inner">
        <div class="copyright">© 2025 w\Scriptum</div>
      </div>
    </footer>
  </div>

  <!-- Сценарий: core, header, page-specific -->
  <script src="/js/core.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/pages/index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тайный скриптум</title>
  <!-- Подключение .css -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Шапка сайта -->
  <header>
    <nav>
      <ul>
        <li><a href="/">Главная</a></li>
        <li><a href="/library">Библиотека</a></li>
      </ul>
      <ul>
        <li><a href="/login">Войти</a></li>
        <li><a href="/register">Регистрация</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="container">
      <!-- Приветственная секция -->
      <section aria-labelledby="hero-title">
        <h1 id="hero-title">Платформа для публикации авторских текстов</h1>
        <p class="hero-text">
          Читайте, публикуйте и делитесь литературой.
          <span class="hero-rlyehian">Шгх’нхарл нугл’тхар фтх’лум</span>
        </p>
      </section>
      <!-- Раздел: Новые публикации -->
      <section aria-labelledby="new-works">
        <h2 id="new-works">Новое</h2>
        <ul id="new-container"></ul>
        <!-- Переадресация /library/new → /library?sort=created -->
        <a href="/library/new" class="view-all">Смотреть все</a>
      </section>

      <!-- Раздел: Обновления глав -->
      <section aria-labelledby="updates">
        <h2 id="updates">Обновления</p>
        <ul id="updates-container"></ul>
        <!-- Переадресация /library/updates → /library?sort=updated -->
        <a href="/library/updates" class="view-all">Смотреть все</a>
      </section>
    </div>
  </main>

  <!-- Подвал сайта -->
  <footer>
    <p>&copy; 2025 w\Scriptum</p>
  </footer>

  <!-- Подключение .js -->
  <script src="scripts/main.js" defer></script>
</body>
</html>
